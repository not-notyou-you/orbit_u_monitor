<!-- pages/catalog.html — Data › Dataset (INTERFACE.md §2.6, M67, M74) [WARIS
     DataLab View 2], diterjemahkan. Tanpa Merge, tanpa reference layers.
     DATA_ENGINEER & ADMIN. "Buat dataset baru" (#data/dataset/baru) memuat
     wizard pages/create-dataset.html di tab yang sama.
     M74: pemilih dataset dan aksinya satu baris di atas (dulu panel kiri yang
     menyisakan ruang kosong panjang di bawahnya); rincian selebar halaman. -->
<div class="ct-bar">
  <div class="field ct-pick"><label for="ctPick">Dataset</label><select id="ctPick"></select></div>
  <button type="button" class="small" id="ctRefresh">Muat ulang</button>
  <div class="ct-acts" id="ctActions" role="group" aria-label="Aksi dataset terpilih">
    <button type="button" data-act="download">Unduh ZIP</button>
    <button type="button" data-act="report">Laporan PDF</button>
    <button type="button" data-act="pause" hidden>Jeda</button>
    <button type="button" data-act="resume" hidden>Lanjutkan</button>
    <button type="button" data-act="retry" hidden>Coba ulang</button>
    <button type="button" data-act="cancel" hidden>Batalkan proses…</button>
    <button type="button" data-act="delete" hidden>Hapus…</button>
  </div>
  <a class="btn default" href="#data/dataset/baru">Buat dataset baru…</a>
</div>
<p class="mut" id="ctActNote" style="margin:0 0 6px;font-size:11px"></p>
<div class="readouts" id="ctReadouts"></div>
<div id="ctProgress"></div>
<div class="tabs" role="tablist" aria-label="Rincian dataset" style="margin-top:8px">
  <button type="button" role="tab" data-tab="ringkasan" aria-selected="true">Ringkasan</button>
  <button type="button" role="tab" data-tab="struktur" aria-selected="false" tabindex="-1">Struktur &amp; kualitas</button>
  <button type="button" role="tab" data-tab="pratinjau" aria-selected="false" tabindex="-1">Pratinjau</button>
  <button type="button" role="tab" data-tab="produk" aria-selected="false" tabindex="-1">Produk &amp; log</button>
</div>
<div class="raised tabpanel" role="tabpanel" id="ctPanel"></div>
<details class="ad-fold"><summary>Ekspor / impor Excel</summary><div id="ctExcel"></div></details>
